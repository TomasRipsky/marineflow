# Publishes the project site (site/) to GitHub Pages.
# One-time setup by the repository owner: Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages caches every file for 10 minutes; a version in each asset URL makes a new deploy visible at once
      - name: Stamp the commit into the asset URLs
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" site/index.html site/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
