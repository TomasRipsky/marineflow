# Root level: silences the JVM startup noise
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Silence the loggers that clutter the output the most
logger.nativecodeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecodeloader.level = error

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = error

logger.shutdownhook.name = org.apache.spark.util.ShutdownHookManager
logger.shutdownhook.level = error

# Structured Streaming progress: keep only real warnings and errors
logger.streamexec.name = org.apache.spark.sql.execution.streaming.StreamExecution
logger.streamexec.level = warn

# Temporarily raise this to "info" when debugging the GCS connector
logger.gcsconnector.name = com.google.cloud.hadoop
logger.gcsconnector.level = warn

# Silence the internal py4j client/server chatter
logger.py4j.name = py4j.clientserver
logger.py4j.level = warn
