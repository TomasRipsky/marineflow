# =============================================================================
# MARINEFLOW — Spark Metrics Configuration
# processing/spark-conf/metrics.properties
#
# Mounted at $SPARK_HOME/conf/metrics.properties (Spark's default lookup
# path) — auto-loaded on startup, no --conf spark.metrics.conf.* needed.
# Registers Prometheus as a metrics sink for the driver, exposed at
# http://<container>:4040/metrics/prometheus
# =============================================================================

*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource
