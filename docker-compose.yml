# =============================================================================
# MARINEFLOW — Docker Compose
# Local development stack
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Kafka — local broker (KRaft mode, no Zookeeper). Replaces Pub/Sub as the
  # ingestion transport: the producer publishes here, and Spark reads it
  # natively via the spark-sql-kafka connector (push-based, no GCS landing
  # zone, no file-polling latency).
  # Two listeners: PLAINTEXT for the host (local producer), DOCKER for the
  # internal network (Spark containers).
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: marineflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - marineflow-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # One-shot job: creates the topics explicitly (mirrors what Terraform did
  # for Pub/Sub topics) instead of relying on auto-create.
  # ---------------------------------------------------------------------------
  kafka-init-topics:
    image: apache/kafka:3.7.0
    container_name: marineflow-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic vessel-positions --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic vessel-positions-bronze --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic vessel-metadata --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic vessel-metadata-bronze --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic dead-letter-queue --partitions 1 --replication-factor 1 --bootstrap-server kafka:29092
    networks:
      - marineflow-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Spark Bronze — reads from GCS pubsub-landing via Structured Streaming
  # Each job runs in its own container to avoid concurrent checkpoint conflicts.
  # ---------------------------------------------------------------------------
  spark-bronze:
    build:
      context: ./processing
      dockerfile: Dockerfile
    image: marineflow-spark:3.5.0
    container_name: marineflow-spark-bronze
    entrypoint: ["/bin/sleep", "infinity"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - PIPELINE_VERSION=${PIPELINE_VERSION:-0.1.0}
      - SPARK_MASTER=local[2]
      - SPARK_DRIVER_MEMORY=2g
      # Internal Docker hostname:port — NOT the host's localhost:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_POSITIONS=${KAFKA_TOPIC_POSITIONS:-vessel-positions}
      - KAFKA_TOPIC_POSITIONS_BRONZE=${KAFKA_TOPIC_POSITIONS_BRONZE:-vessel-positions-bronze}
    ports:
      - "4040:4040"
    volumes:
      - ./processing:/opt/spark/processing
      - ./processing/spark-conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
      - ./processing/spark-conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Spark Silver Positions — reads from Kafka vessel-positions-bronze
  # ---------------------------------------------------------------------------
  spark-silver-positions:
    build:
      context: ./processing
      dockerfile: Dockerfile
    image: marineflow-spark:3.5.0
    container_name: marineflow-spark-silver-positions
    entrypoint: ["/bin/sleep", "infinity"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - BQ_DATASET_SILVER=marineflow_silver
      - SPARK_MASTER=local[2]
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_POSITIONS_BRONZE=${KAFKA_TOPIC_POSITIONS_BRONZE:-vessel-positions-bronze}
    volumes:
      - ./processing:/opt/spark/processing
      - ./processing/spark-conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Spark Bronze Metadata — reads Kafka vessel-metadata, writes GCS + Kafka
  # ---------------------------------------------------------------------------
  spark-bronze-metadata:
    build:
      context: ./processing
      dockerfile: Dockerfile
    image: marineflow-spark:3.5.0
    container_name: marineflow-spark-bronze-metadata
    entrypoint: ["/bin/sleep", "infinity"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - PIPELINE_VERSION=${PIPELINE_VERSION:-0.1.0}
      - SPARK_MASTER=local[2]
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_METADATA=${KAFKA_TOPIC_METADATA:-vessel-metadata}
      - KAFKA_TOPIC_METADATA_BRONZE=${KAFKA_TOPIC_METADATA_BRONZE:-vessel-metadata-bronze}
    volumes:
      - ./processing:/opt/spark/processing
      - ./processing/spark-conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Spark Silver Metadata — reads Kafka vessel-metadata-bronze
  # ---------------------------------------------------------------------------
  spark-silver-metadata:
    build:
      context: ./processing
      dockerfile: Dockerfile
    image: marineflow-spark:3.5.0
    container_name: marineflow-spark-silver-metadata
    entrypoint: ["/bin/sleep", "infinity"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - BQ_DATASET_SILVER=marineflow_silver
      - SPARK_MASTER=local[2]
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_METADATA_BRONZE=${KAFKA_TOPIC_METADATA_BRONZE:-vessel-metadata-bronze}
    volumes:
      - ./processing:/opt/spark/processing
      - ./processing/spark-conf/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
      - spark-ivy-cache:/opt/spark/.ivy2
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Airflow — pipeline orchestration
  # ---------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: marineflow-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@marineflow.io
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://marineflow:marineflow_dev_password@postgres:5432/marineflow
      - AIRFLOW__CORE__FERNET_KEY=ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marineflow-net
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: marineflow-airflow-webserver
    command: webserver
    ports:
      - "4080:8080"   # Airflow UI → http://localhost:4080
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://marineflow:marineflow_dev_password@postgres:5432/marineflow
      - AIRFLOW__CORE__FERNET_KEY=ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=marineflow_secret
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - marineflow-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    image: marineflow-airflow:2.8.1
    container_name: marineflow-airflow-scheduler
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://marineflow:marineflow_dev_password@postgres:5432/marineflow
      - AIRFLOW__CORE__FERNET_KEY=ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./transformation/dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # PostgreSQL — backend for Airflow
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: marineflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marineflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marineflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-marineflow}
    ports:
      - "5434:5432"   # avoid conflict with local PostgreSQL on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - marineflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marineflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka Exporter — consumer group lag, topic/partition metrics for Prometheus
  # ---------------------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: marineflow-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Prometheus — pipeline metrics
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: marineflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Grafana — operational dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: marineflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-marineflow_dev}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=hamedkarbasi93-kafka-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=hamedkarbasi93-kafka-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - marineflow-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
  grafana-data:
  airflow-logs:
  kafka-data:
  spark-ivy-cache:

# =============================================================================
# Networks
# =============================================================================
networks:
  marineflow-net:
    driver: bridge