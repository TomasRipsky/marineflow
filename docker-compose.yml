# =============================================================================
# MARINEFLOW — Docker Compose
# Local development stack
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Spark Bronze — reads from GCS pubsub-landing via Structured Streaming
  # Each job runs in its own container to avoid concurrent checkpoint conflicts.
  # ---------------------------------------------------------------------------
  spark-bronze:
    image: apache/spark:3.5.0
    container_name: marineflow-spark-bronze
    entrypoint: ["/bin/sleep", "infinity"]   # keep alive for docker exec
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - PIPELINE_VERSION=${PIPELINE_VERSION:-0.1.0}
      - SPARK_MASTER=local[2]
    volumes:
      - ./processing:/opt/spark/processing
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Spark Silver Positions — reads from GCS Bronze via Structured Streaming
  # ---------------------------------------------------------------------------
  spark-silver-positions:
    image: apache/spark:3.5.0
    container_name: marineflow-spark-silver-positions
    entrypoint: ["/bin/sleep", "infinity"]
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - BQ_DATASET_SILVER=marineflow_silver
      - SPARK_MASTER=local[2]
    volumes:
      - ./processing:/opt/spark/processing
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Spark Silver Metadata — reads from GCS pubsub-landing/vessel-metadata
  # ---------------------------------------------------------------------------
  spark-silver-metadata:
    image: apache/spark:3.5.0
    container_name: marineflow-spark-silver-metadata
    entrypoint: ["/bin/sleep", "infinity"]
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc.json
      - BQ_DATASET_SILVER=marineflow_silver
      - SPARK_MASTER=local[2]
    volumes:
      - ./processing:/opt/spark/processing
      - ${ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/tmp/adc.json:ro
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # PostgreSQL — backend for Airflow and MLflow
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: marineflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marineflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marineflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-marineflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - marineflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marineflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — cache for FastAPI predictions
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: marineflow-redis
    ports:
      - "6379:6379"
    networks:
      - marineflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MLflow — model tracking and registry
  # ---------------------------------------------------------------------------
  mlflow:
    image: python:3.11-slim
    container_name: marineflow-mlflow
    command: >
      bash -c "pip install mlflow==2.11.1 psycopg2-binary &&
               mlflow server
               --backend-store-uri postgresql://marineflow:marineflow_dev_password@postgres:5432/marineflow
               --default-artifact-root gs://${GCS_BUCKET}/models/mlflow
               --host 0.0.0.0
               --port 5001"
    ports:
      - "5001:5001"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/gcp-credentials.json
    volumes:
      - ./gcp-credentials.json:/opt/gcp-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Prometheus — pipeline metrics
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: marineflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - marineflow-net

  # ---------------------------------------------------------------------------
  # Grafana — operational dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: marineflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-marineflow_dev}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - marineflow-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
  grafana-data:

# =============================================================================
# Networks
# =============================================================================
networks:
  marineflow-net:
    driver: bridge