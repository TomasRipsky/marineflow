# =============================================================================
# MARINEFLOW — Prometheus Configuration
# monitoring/prometheus/prometheus.yml
#
# Scrapes each Spark driver's built-in Prometheus servlet
# (spark.ui.prometheus.enabled=true), exposed at :4040/metrics/prometheus
# inside the marineflow-net Docker network. No host port mapping needed —
# Prometheus reaches each container directly by its Compose service name.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "marineflow"
    environment: "dev"

scrape_configs:
  - job_name: "spark-bronze-positions"
    metrics_path: "/metrics/prometheus/"
    static_configs:
      - targets: ["spark-bronze:4040"]
        labels: { job_role: "bronze", entity: "positions" }

  - job_name: "spark-bronze-metadata"
    metrics_path: "/metrics/prometheus/"
    static_configs:
      - targets: ["spark-bronze-metadata:4040"]
        labels: { job_role: "bronze", entity: "metadata" }

  - job_name: "spark-silver-positions"
    metrics_path: "/metrics/prometheus/"
    static_configs:
      - targets: ["spark-silver-positions:4040"]
        labels: { job_role: "silver", entity: "positions" }

  - job_name: "spark-silver-metadata"
    metrics_path: "/metrics/prometheus/"
    static_configs:
      - targets: ["spark-silver-metadata:4040"]
        labels: { job_role: "silver", entity: "metadata" }

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels: { job_role: "kafka", entity: "lag" }
